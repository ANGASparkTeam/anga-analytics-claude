# Copy to properties.yaml (or point GA4_PROPERTIES_FILE at it) and edit.
# `id` is the numeric GA4 property id (Admin > Property details), as a string.
# Optional: any property the server's GA identity can see also works by numeric id.
default: main
properties:
  main:
    id: "123456789"
    name: "เว็บไซต์หลัก"
    timezone: "Asia/Bangkok"   # used to resolve today/yesterday/NdaysAgo
    currency: "THB"
    key_events: ["purchase", "generate_lead"]
  app:
    id: "987654321"
    name: "แอป"
    key_events: ["sign_up"]
