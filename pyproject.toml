[project]
name = "ga4-mcp"
version = "0.1.0"
description = "Remote MCP server for read-only GA4 marketing reports (Cloud Run, Google sign-in)"
readme = "README.md"
authors = [
    { name = "ANGA Spark Team", email = "spark@anga.co.th" }
]
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.2.6",
    "fastmcp>=4.1.4,<5",
    "google-analytics-admin>=0.30.2",
    "google-analytics-data>=0.23.3",
    "httpx>=0.28",
    "py-key-value-aio[firestore]>=0.4.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
ga4-mcp = "ga4_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]
